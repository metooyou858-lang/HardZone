server {
    listen 80;
    listen [::]:80;
    server_name hardzone.space www.hardzone.space 79.137.162.55 _;
    client_max_body_size 6m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hardzone.space www.hardzone.space 79.137.162.55 _;
    client_max_body_size 6m;

    ssl_certificate /etc/letsencrypt/live/hardzone.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hardzone.space/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:HardZoneSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security max-age=15552000 always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Telegram Mini App scans barcodes with the device camera. Keep camera
    # restricted to HardZone itself; microphone and geolocation stay disabled.
    add_header Permissions-Policy camera=(self),microphone=(),geolocation=() always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 30s;
    }
}
